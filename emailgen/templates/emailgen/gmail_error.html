{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Connection Error - ColdMail AI</title>
    <link rel="stylesheet" href="{% static 'emailgen/css/navbar.css' %}">
</head>
<body style="font-family: 'Segoe UI', sans-serif; margin: 0; background: linear-gradient(135deg, #1e3c72, #2a5298); min-height: 100vh;">

    {% include 'emailgen/partials/navbar.html' %}

    <div style="max-width: 480px; margin: 60px auto; background: #fff; padding: 35px 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">

        <span style="color: #c0392b; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">
            Connection Failed
        </span>

        <h2 style="color: #1e3c72; margin: 8px 0 15px;">Gmail connection failed</h2>

        <p style="color: #555; margin-bottom: 25px; line-height: 1.5;">
            {{ error }}
        </p>

        <div style="display: flex; gap: 10px;">
            <a href="{% url 'gmail_connect' %}"
               style="flex: 1; text-align: center; padding: 12px; background: #1e3c72; color: #fff; border-radius: 6px; text-decoration: none; font-weight: 600;">
                Try Again
            </a>

            <a href="{% url 'home' %}"
               style="flex: 1; text-align: center; padding: 12px; background: #eef1f7; color: #1e3c72; border-radius: 6px; text-decoration: none; font-weight: 600;">
                Back to Dashboard
            </a>
        </div>

    </div>

</body>
</html>
